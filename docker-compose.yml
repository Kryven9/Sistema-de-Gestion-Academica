# Servicio de MySQL para desarrollo del SGA
# Levanta el contenedor con:
#   docker compose up -d
# Ver logs:
#   docker compose logs -f mysql
# Detener:
#   docker compose down
# Detener y limpiar volumen (datos):
#   docker compose down -v

services:
  mysql:
    image: mysql:8.0
    container_name: sga-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sga_universitario
      MYSQL_USER: sga
      MYSQL_PASSWORD: sga_dev_password
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
    name: sga-mysql-data
